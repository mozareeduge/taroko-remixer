name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── v07 baseline ──────────────────────────────────────────────
  v07-baseline:
    name: v07 baseline (534 tests)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: "3.11"
      - name: Prepare job-local Python on Windows
        if: runner.os == 'Windows'
        run: |
          # Use the runner's Python without system installation or registry writes.
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          venv = Path(os.environ["RUNNER_TEMP"]) / "v07-python"
          subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
          scripts = venv / "Scripts"
          # Legacy subprocesses explicitly invoke python3; provide that executable locally.
          shutil.copyfile(scripts / "python.exe", scripts / "python3.exe")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path:
              path.write(f"{scripts}\n")
          PY
      - name: Install Python test deps
        run: python -m pip install websocket-client requests
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Export Playwright Chromium binary path
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          home = Path.home()
          roots = [home / ".cache/ms-playwright", home / "Library/Caches/ms-playwright"]
          if os.environ.get("LOCALAPPDATA"):
              roots.insert(0, Path(os.environ["LOCALAPPDATA"]) / "ms-playwright")
          if os.environ.get("PLAYWRIGHT_BROWSERS_PATH"):
              roots.insert(0, Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"]))
          patterns = ["chromium*/chrome-win*/chrome.exe", "chromium*/chrome-linux*/chrome",
                      "chromium*/chrome-mac*/Chromium.app/Contents/MacOS/Chromium"]
          chromium = next((p.resolve() for root in roots for pattern in patterns
                           for p in sorted(root.glob(pattern), reverse=True) if p.is_file()), None)
          if chromium is None:
              raise SystemExit("Installed Playwright Chromium binary not found")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TAROKE_CHROMIUM_PATH={chromium}\n")
          print(f"Resolved chromium: {chromium}")
          PY
      - name: Run v07 baseline (deterministic verifier)
        run: python3 scripts/verify_v07_baseline.py
        timeout-minutes: 15

  # ── v08 typecheck ─────────────────────────────────────────────
  v08-typecheck:
    name: v08 TypeScript
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # A stalled registry fetch once hung this step for 35 min on the
        # self-hosted runner; a normal install takes ~30 s. Fail fast, retry.
        run: |
          for attempt in 1 2 3; do
            timeout 150 npm ci --ignore-scripts --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Typecheck all packages
        run: npm run typecheck

  # ── v08 unit tests ────────────────────────────────────────────
  v08-unit:
    name: v08 unit tests (Vitest)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: v08-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # A stalled registry fetch once hung this step for 35 min on the
        # self-hosted runner; a normal install takes ~30 s. Fail fast, retry.
        run: |
          for attempt in 1 2 3; do
            timeout 150 npm ci --ignore-scripts --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Run unit tests
        run: npm run test:workbench

  # ── v08 build ─────────────────────────────────────────────────
  v08-build-next:
    name: v08 build /next/
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: v08-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # A stalled registry fetch once hung this step for 35 min on the
        # self-hosted runner; a normal install takes ~30 s. Fail fast, retry.
        run: |
          for attempt in 1 2 3; do
            timeout 150 npm ci --ignore-scripts --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Build /next/
        run: npm run build:next

  # ── v08 E2E (Chromium) ────────────────────────────────────────
  v08-e2e-chromium:
    name: v08 E2E Chromium
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    needs: v08-build-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # A stalled registry fetch once hung this step for 35 min on the
        # self-hosted runner; a normal install takes ~30 s. Fail fast, retry.
        run: |
          for attempt in 1 2 3; do
            timeout 150 npm ci --ignore-scripts --prefer-offline --no-audit --no-fund && exit 0
            echo "npm ci attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/workbench
      - name: Build /next/ locally for E2E
        run: npm run build:next
      - name: Run E2E (Chromium)
        run: npm run test:e2e -- --project=chromium
        working-directory: apps/workbench
      - name: Upload test report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chromium-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── v08 E2E (Firefox) ─────────────────────────────────────────
  v08-e2e-firefox:

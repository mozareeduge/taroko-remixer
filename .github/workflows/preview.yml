name: Deploy Preview

# Deploys the public Pages preview.
# v1.0.3 (formerly /next2/) at the root (/), v08 candidate app at /next/,
# v07.8 legacy app archived at /archive/v07.8/.
#
# REQUIRES: GitHub Pages enabled (Settings → Pages → Source: GitHub Actions)
#
# Public URL: https://taroko-remixer.theblackbirdfield.com/
# v1.0.3 (root):        https://taroko-remixer.theblackbirdfield.com/
# v08 (/next/):         https://taroko-remixer.theblackbirdfield.com/next/
# v1.0.3 (/next2/):     https://taroko-remixer.theblackbirdfield.com/next2/ (mirror of root)
# v07.8 (/archive/v07.8/): https://taroko-remixer.theblackbirdfield.com/archive/v07.8/
#
# v1.0.3 was promoted from /next2/ to root on 2026-08-26 (approved five design repairs).
# v07.8 is preserved unmodified in the repo root (index.html/styles.css/src/) — its 534-test
# CI suite (scripts/verify_v07_baseline.py) still runs against those files in place — but it
# is now deployed only at /archive/v07.8/, not at the live root.

# Manual only since 2026-10-03: Pages serves the `gh-pages` branch
# (build_type legacy), so this Actions-based deploy cannot publish and failed
# on every push. Kept, not deleted: to re-enable, restore the push trigger and
# switch Settings -> Pages back to "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    name: Build and deploy checkpoint preview
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build v08 app for GitHub Pages (/next/ base served at site root)
        run: npm run build --workspace=apps/workbench
        env:
          # Absolute base matching the deployed path on the custom domain
          # (taroko-remixer.theblackbirdfield.com serves the Pages artifact at its root).
          VITE_BASE: /next/

      - name: Assemble Pages output
        run: |
          mkdir -p _site/next _site/next2 _site/archive/v07.8
          # v1.0.3 (promoted from /next2/) at root
          cp next2/index.html _site/index.html
          # v1.0.3 also kept at /next2/ as a stable mirror URL
          cp next2/index.html _site/next2/index.html
          # v08 at /next/
          cp -r next/. _site/next/
          # v07.8 legacy app, archived (source untouched at repo root; deployed under /archive/ only)
          cp index.html _site/archive/v07.8/index.html
          cp styles.css _site/archive/v07.8/styles.css
          cp -r src/ _site/archive/v07.8/src/
          cp sample_v07_reset.taroke.json _site/archive/v07.8/ 2>/dev/null || true

      - name: Add Pages 404 fallback (SPA routing for v08)
        run: |
          # v08 SPA needs all /next/* paths to serve next/index.html
          cp _site/next/index.html _site/next/404.html 2>/dev/null || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
